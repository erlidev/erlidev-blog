baseURL: https://erli.xyz/
locale: en-US
title: Erlidev
theme: PaperMod
copyright: "© Erlidev"
enableRobotsTXT: true
enableGitInfo: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true
  minifyOutput: true

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: false

params:
  env: production
  author: Erlidev
  description: Independent notes on AI, LLM evaluation, software engineering, and the systems behind them.
  keywords:
    - AI
    - LLM benchmarks
    - software engineering
    - technical writing
  defaultTheme: auto
  disableThemeToggle: false
  displayFullLangName: true

  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  homeInfoParams:
    Title: "AI Field Notes"
    Content: |
      Hi, I'm Eric. I've been working with AI since the Llama 1 days and I'm here to share what I know. I post my research, projects, and essays here.
    PrimaryAction:
      Name: Read the latest posts
      URL: /posts/

  socialIcons:
    - name: github
      title: GitHub profile
      url: https://github.com/erlidev
    - name: rss
      title: RSS feed
      url: /index.xml

  assets:
    disableHLJS: true

  cover:
    linkFullImages: true
    responsiveImages: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys:
      - title
      - permalink
      - summary
      - content

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50
privacy:
  x:
    enableDNT: true
  youtube:
    privacyEnhanced: true

services:
  rss:
    limit: 20
